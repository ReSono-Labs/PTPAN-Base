[package]
name = "federation-base"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Host-neutral PTPAN Base policy and relationship types"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_json_canonicalizer = "=0.3.2"
sha2 = "0.10"
http = "=1.5.0"
base64 = "=0.22.1"
unicode-normalization = "=0.1.26"
ed25519-dalek = "=2.2.0"
bs58 = "=0.5.1"
