[package]
name = "ptpan-test-support"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Test-only in-process stand-ins for the bridge and PostgreSQL helpers. Not shipped."
publish = false

[dependencies]
federation-base = { path = "../federation-base" }
federation-ipc = { path = "../federation-ipc" }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "net", "io-util", "time"] }
tokio-postgres = "=0.7.16"
serde_json = "1"
base64 = "=0.22.1"
