# PTPAN Docker ladder: two independent providers (A and B), each with its own
# SPIRE server and agent, PostgreSQL exchange store, adapter runtime, Go
# bridge, reference platform and well-known domain-proof server. Started by
# scripts/ladder/run.sh with a per-run project name and scratch directory
# (LADDER_RUN); every container, network and volume is removed by that run.
#
# Test profile only: SPIRE agents use insecure_bootstrap and domain proofs are
# plain HTTP (--test-allow-http-domain-proof). Production uses SPIRE's
# bootstrap bundle and HTTPS with WebPKI.
#
# Process users: bridge 10001, adapter 10002, platform 10003, all in group
# 10000 so the 0660 local sockets connect; each side checks the exact peer UID.
name: ptpan-ladder
networks:
  federation: {}
  provider-a: {}
  provider-b: {}
services:
  init-sockets:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    profiles: ["ptpan"]
    user: "0:0"
    command: ["sh", "-c", "chown 0:10000 /a /b && chmod 2770 /a /b"]
    volumes:
      - ptpan-sockets-a:/a
      - ptpan-sockets-b:/b


  spire-server-a:
    image: ghcr.io/spiffe/spire-server:1.15.5@sha256:584a9c5cc95b9457f5033e7e4488d603fffe5ec48a80c4dba14b05c5e1c2c384
    command: ["-config", "/conf/server.conf"]
    volumes:
      - ./spire/server-a.conf:/conf/server.conf:ro
    tmpfs: ["/opt/spire/data/server:mode=1777", "/tmp/spire-server:mode=1777"]
    networks: [federation, provider-a]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 2s
      retries: 30

  spire-agent-a:
    image: ghcr.io/spiffe/spire-agent:1.15.5@sha256:3652c732b0f0d36f4dd78394230a1b1cd0ddcc29548a46c67a996b1a78c14481
    profiles: ["agents"]
    pid: host
    command: ["-config", "/conf/agent.conf", "-joinToken", "${JOIN_TOKEN_A:-}"]
    volumes:
      - ./spire/agent-a.conf:/conf/agent.conf:ro
      - spire-socket-a:/run/spire
    tmpfs: ["/opt/spire/data/agent:mode=1777"]
    networks: [provider-a]

  pg-a:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: ladder
    tmpfs: ["/var/lib/postgresql/data"]
    networks: [provider-a]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  wellknown-a:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["httpd", "-f", "-p", "80", "-h", "/www"]
    volumes:
      - ${LADDER_RUN}/www-a:/www:ro
    networks:
      federation:
        aliases: ["provider-a.test"]

  adapter-a:
    image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    profiles: ["ptpan"]
    user: "10002:10000"
    command: ["/opt/ptpan/ptpan-adapter", "run", "/cfg/adapter.json"]
    volumes:
      - ${LADDER_RUN}/bin/ptpan-adapter:/opt/ptpan/ptpan-adapter:ro
      - ${LADDER_RUN}/cfg-a:/cfg
      - ptpan-sockets-a:/run/ptpan
    networks: [provider-a]

  bridge-a:
    image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    profiles: ["ptpan"]
    user: "10001:10000"
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent.sock
    command:
      - /opt/ptpan/bridge-runtime
      - --control-listen=0.0.0.0:8444
      - --edge-listen=0.0.0.0:8443
      - --control-service-id=spiffe://provider-a.test/federation/control
      - --edge-service-id=spiffe://provider-a.test/federation/edge
      - --bridge-socket=/run/ptpan/bridge.sock
      - --runtime-socket=/run/ptpan/runtime.sock
      - --runtime-uid=10002
      - --egress-socket=/run/ptpan/egress.sock
      - --ingress-socket=/run/ptpan/ingress.sock
      - --platform-uid=10003
      - --test-allow-http-domain-proof
    volumes:
      - ${LADDER_RUN}/bin/bridge-runtime:/opt/ptpan/bridge-runtime:ro
      - spire-socket-a:/run/spire
      - ptpan-sockets-a:/run/ptpan
    networks:
      provider-a: {}
      federation:
        aliases: ["control.provider-a.test", "edge.provider-a.test"]

  platform-a:
    image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    profiles: ["ptpan"]
    user: "10003:10000"
    command: ["/opt/ptpan/ptpan-reference-platform", "/cfg/platform.json", "serve"]
    volumes:
      - ${LADDER_RUN}/bin/ptpan-reference-platform:/opt/ptpan/ptpan-reference-platform:ro
      - ${LADDER_RUN}/platform-a:/data
      - ${LADDER_RUN}/cfg-a:/cfg:ro
      - ptpan-sockets-a:/run/ptpan
    networks: [provider-a]

  spire-server-b:
    image: ghcr.io/spiffe/spire-server:1.15.5@sha256:584a9c5cc95b9457f5033e7e4488d603fffe5ec48a80c4dba14b05c5e1c2c384
    command: ["-config", "/conf/server.conf"]
    volumes:
      - ./spire/server-b.conf:/conf/server.conf:ro
    tmpfs: ["/opt/spire/data/server:mode=1777", "/tmp/spire-server:mode=1777"]
    networks: [federation, provider-b]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 2s
      retries: 30

  spire-agent-b:
    image: ghcr.io/spiffe/spire-agent:1.15.5@sha256:3652c732b0f0d36f4dd78394230a1b1cd0ddcc29548a46c67a996b1a78c14481
    profiles: ["agents"]
    pid: host
    command: ["-config", "/conf/agent.conf", "-joinToken", "${JOIN_TOKEN_B:-}"]
    volumes:
      - ./spire/agent-b.conf:/conf/agent.conf:ro
      - spire-socket-b:/run/spire
    tmpfs: ["/opt/spire/data/agent:mode=1777"]
    networks: [provider-b]

  pg-b:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: ladder
    tmpfs: ["/var/lib/postgresql/data"]
    networks: [provider-b]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  wellknown-b:
    image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["httpd", "-f", "-p", "80", "-h", "/www"]
    volumes:
      - ${LADDER_RUN}/www-b:/www:ro
    networks:
      federation:
        aliases: ["provider-b.test"]

  adapter-b:
    image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    profiles: ["ptpan"]
    user: "10002:10000"
    command: ["/opt/ptpan/ptpan-adapter", "run", "/cfg/adapter.json"]
    volumes:
      - ${LADDER_RUN}/bin/ptpan-adapter:/opt/ptpan/ptpan-adapter:ro
      - ${LADDER_RUN}/cfg-b:/cfg
      - ptpan-sockets-b:/run/ptpan
    networks: [provider-b]

  bridge-b:
    image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    profiles: ["ptpan"]
    user: "10001:10000"
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent.sock
    command:
      - /opt/ptpan/bridge-runtime
      - --control-listen=0.0.0.0:8444
      - --edge-listen=0.0.0.0:8443
      - --control-service-id=spiffe://provider-b.test/federation/control
      - --edge-service-id=spiffe://provider-b.test/federation/edge
      - --bridge-socket=/run/ptpan/bridge.sock
      - --runtime-socket=/run/ptpan/runtime.sock
      - --runtime-uid=10002
      - --egress-socket=/run/ptpan/egress.sock
      - --ingress-socket=/run/ptpan/ingress.sock
      - --platform-uid=10003
      - --test-allow-http-domain-proof
    volumes:
      - ${LADDER_RUN}/bin/bridge-runtime:/opt/ptpan/bridge-runtime:ro
      - spire-socket-b:/run/spire
      - ptpan-sockets-b:/run/ptpan
    networks:
      provider-b: {}
      federation:
        aliases: ["control.provider-b.test", "edge.provider-b.test"]

  platform-b:
    image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    profiles: ["ptpan"]
    user: "10003:10000"
    command: ["/opt/ptpan/ptpan-reference-platform", "/cfg/platform.json", "serve"]
    volumes:
      - ${LADDER_RUN}/bin/ptpan-reference-platform:/opt/ptpan/ptpan-reference-platform:ro
      - ${LADDER_RUN}/platform-b:/data
      - ${LADDER_RUN}/cfg-b:/cfg:ro
      - ptpan-sockets-b:/run/ptpan
    networks: [provider-b]

volumes:
  spire-socket-a: {}
  spire-socket-b: {}
  ptpan-sockets-a: {}
  ptpan-sockets-b: {}
