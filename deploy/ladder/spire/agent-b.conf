agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    server_address = "spire-server-b"
    server_port = "8081"
    socket_path = "/run/spire/agent.sock"
    insecure_bootstrap = true
    trust_domain = "provider-b.test"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "memory" {
        plugin_data {}
    }
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
