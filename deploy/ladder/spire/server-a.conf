server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/tmp/spire-server/private/api.sock"
    trust_domain = "provider-a.test"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"
    ca_subject {
        organization = ["PTPAN ladder provider a"]
    }
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port = 8443
            profile "https_spiffe" {}
        }
        federates_with "provider-b.test" {
            bundle_endpoint_url = "https://spire-server-b:8443"
            bundle_endpoint_profile "https_spiffe" {
                endpoint_spiffe_id = "spiffe://provider-b.test/spire/server"
            }
        }
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "memory" {
        plugin_data {}
    }
}
